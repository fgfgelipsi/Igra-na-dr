<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@wanterfent: выбери сюжет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
/* VOICE: playful winter birthday cartoon, warm and silly, for kids
   IDEA: a pop-up storybook stage in two chapters where you pick what happens next
   PICTURE: @wanterfent on drawn sets with blocky friends, a corgi suspect and live particles
   COLOUR and TYPE: deep plum housing, Christmas red + violet hair purple + candle gold; Rubik / Rubik Mono One
   LAYOUT: portrait stage on top, dialogue panel with choices beneath, chapter menu with endings */
:root{--plum:#2a1240;--red:#e0262f;--vio:#8b4dff;--gold:#ffc83d;--ink:#fff;color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 20% 10%,#4a1f6e,transparent 50%),radial-gradient(circle at 80% 90%,#5c1230,transparent 50%),#1a0a28;color:var(--ink);font:16px/1.45 Rubik,system-ui,sans-serif;overflow:hidden}
#app{position:relative;max-width:520px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--plum);box-shadow:0 0 60px #0008;overflow:hidden}
#scene{position:relative;flex:1;overflow:hidden;transition:filter .35s}
#scene.fade{filter:brightness(0)}
.bg{position:absolute;inset:0}
.bg-bedroom{background:linear-gradient(#c9a6f2 0 70%,#8a5a3c 70% 71%,transparent 71%),repeating-linear-gradient(90deg,#a36b45 0 44px,#93603c 44px 46px)}
.bg-kitchen{background:repeating-linear-gradient(0deg,#ffe9b8 0 22px,#f0d79e 22px 24px),#ffe9b8}
.bg-kitchen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-conic-gradient(#f4f0f8 0 25%,#6b4f86 0 50%) 0 0/48px 48px}
.bg-hall{background:linear-gradient(transparent 72%,#5a3a2a 72%),linear-gradient(90deg,#ffd9a8,#f7c48a)}
.bg-street{background:linear-gradient(#2b2a6e,#7a5fb5 55%,#e8b4d8 68%,#f4f6ff 68%,#dde4f7)}
.bg-shop{background:linear-gradient(transparent 72%,#7a4b2b 72%),linear-gradient(#ffcf6b,#ff9e5e)}
.bg-night{background:radial-gradient(circle at 50% 120%,#3a2a7a,transparent 60%),linear-gradient(#060821,#1a1450 70%,#e9eefc 70%,#cfd8f2)}
.bg-party{background:linear-gradient(transparent 72%,#3a1550 72%),radial-gradient(circle at 50% 30%,#ff5fa8,#b0267a 50%,#5d1470)}
.bg-dream{background:linear-gradient(#ffb3d9,#ffd6a5 60%,#fff0f7)}
.bg-alley{background:linear-gradient(#24205a,#5d4596 60%,#eef1ff 60%,#d5dcf2)}
.prop{position:absolute;transform:translateX(-50%);pointer-events:none}
.prop svg{display:block;width:100%;height:auto;overflow:visible}
.front{z-index:4}
#hero{position:absolute;bottom:3%;height:72%;aspect-ratio:563/998;transform:translateX(-50%);z-index:3;transition:left .8s cubic-bezier(.5,1.6,.5,1)}
#heroIn{position:absolute;inset:0;transform-origin:50% 100%}
#heroIn img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 8px #0005)}
#tag{position:absolute;left:50%;top:-11%;transform:translateX(-50%);white-space:nowrap;font:600 13px/1 Rubik;color:#fff;background:#0008;padding:5px 9px;border-radius:7px;text-shadow:0 1px 0 #000}
#tag::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fdf7a;margin-right:6px;vertical-align:1px}
#shadow{position:absolute;left:15%;right:15%;bottom:-2%;height:5%;border-radius:50%;background:#0004;filter:blur(3px)}
#deerGlow{position:absolute;left:51%;top:66%;width:28%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#fff6b0,#ffc83d66 45%,transparent 70%);opacity:0;transition:opacity .3s}
#hero.deer #deerGlow{opacity:1;animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.3)}}
.a-idle #heroIn{animation:bob 2.2s ease-in-out infinite}
.a-jump #heroIn{animation:jump .7s cubic-bezier(.3,0,.4,1) infinite}
.a-shake #heroIn{animation:shake .25s linear infinite}
.a-spin #heroIn{animation:spin 1.4s ease-in-out infinite}
.a-run #heroIn{animation:run .5s linear infinite}
.a-float #heroIn{animation:float 3s ease-in-out infinite}
.a-dance #heroIn{animation:dance .9s ease-in-out infinite}
.a-sink #heroIn{animation:none;transform:translateY(44%)}
#hero.talk #heroIn{animation-duration:.5s}
@keyframes bob{50%{transform:translateY(-2.5%) scaleY(1.01)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.04,.96)}40%{transform:translateY(-18%) scale(.97,1.04)}}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes spin{50%{transform:scaleX(-1)}}
@keyframes run{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6%) rotate(4deg)}}
@keyframes float{50%{transform:translateY(-8%) rotate(3deg)}}
@keyframes dance{25%{transform:rotate(-9deg) translateY(-4%)}75%{transform:rotate(9deg) translateY(-4%)}}
.fr{position:absolute;bottom:3%;height:50%;aspect-ratio:100/212;z-index:2;transform:translateX(-50%);transition:left .6s}
.fr .in{position:absolute;inset:0;transform-origin:50% 100%;animation:bob 1.8s ease-in-out infinite}
.fr svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 6px 5px #0004)}
.fr .nm{position:absolute;left:50%;top:-7%;transform:translateX(-50%);font:600 11px/1 Rubik;background:#0007;color:#fff;padding:4px 7px;border-radius:6px;white-space:nowrap}
.fr.talk .in{animation:jump .55s ease-in-out infinite}
.fr.talk .armR{transform-box:fill-box;transform-origin:50% 6%;animation:wave .45s infinite alternate}
.fr.far{height:34%;bottom:30%;filter:brightness(.85)}
@keyframes wave{from{transform:rotate(-160deg)}to{transform:rotate(-120deg)}}
#dark{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .4s;overflow:hidden}
#dark.dark{opacity:1;background:#05030ae8}
#dark.flash{opacity:1}
#dark.flash::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;top:40%;left:20%;box-shadow:0 0 0 2000px #05030aea,inset 0 0 40px 20px #05030a;animation:beam 3.2s ease-in-out infinite alternate}
@keyframes beam{to{left:62%;top:54%}}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#banner{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:1;white-space:nowrap;font:800 clamp(15px,4.6vw,22px)/1 Rubik;color:#fff;text-shadow:0 3px 0 #b0267a,0 0 18px #ff9de0;display:none}
#chapTag{position:absolute;left:10px;top:10px;z-index:8;font:600 12px/1 Rubik;background:#0006;padding:8px 10px;border-radius:10px;backdrop-filter:blur(6px)}
#top{position:absolute;top:0;right:0;z-index:8;display:flex;gap:8px;padding:10px}
.ib{min-width:44px;height:44px;border-radius:14px;border:0;background:#0006;color:#fff;font:600 14px Rubik;padding:0 12px;cursor:pointer;backdrop-filter:blur(6px)}
.ib:focus-visible,.ch:focus-visible,.big:focus-visible,.chap:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#panel{position:relative;z-index:7;background:linear-gradient(#2a1240,#1d0b2e);border-top:4px solid var(--red);padding:14px 16px calc(16px + env(safe-area-inset-bottom));min-height:34dvh;max-height:52dvh;overflow-y:auto;cursor:pointer}
#panel::before{content:"";position:absolute;left:0;right:0;top:-12px;height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,#fff 14px 28px);opacity:.9}
#who{display:inline-block;font:800 13px/1 Rubik;padding:6px 10px;border-radius:8px;margin-bottom:8px;color:#1a0a28}
#txt{font-size:17px;min-height:3.2em;margin:0 0 12px}
#next{font-size:13px;opacity:.6;text-align:right;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#choices{display:grid;gap:9px}
.ch{width:100%;min-height:48px;text-align:left;border:0;border-radius:14px;padding:11px 14px;font:600 16px/1.25 Rubik;color:#1a0a28;background:#fff;box-shadow:0 4px 0 #0007;cursor:pointer;opacity:0;transform:translateY(10px);animation:pop .35s forwards;display:flex;gap:10px;align-items:center}
.ch b{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--vio);color:#fff;font-size:14px}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
@keyframes pop{to{opacity:1;transform:none}}
.ov{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;text-align:center;padding:22px 18px calc(24px + env(safe-area-inset-bottom));overflow-y:auto}
.ov.on{display:flex}
#start{background:radial-gradient(circle at 50% 28%,#7a2a9a,#2a1240 70%)}
#start h1{font:400 clamp(24px,7.4vw,36px)/1.05 "Rubik Mono One",Rubik;margin:6px 0 4px;color:#fff;text-shadow:0 4px 0 var(--red)}
#start p{margin:0 0 14px;opacity:.85;max-width:34ch}
.cast{display:flex;align-items:flex-end;justify-content:center;gap:0;height:26dvh;min-height:150px;margin-top:8px}
.cast img{height:100%;filter:drop-shadow(0 10px 14px #0008);animation:bob 2s ease-in-out infinite;z-index:1}
.cast .f{height:72%;aspect-ratio:100/212;margin:0 -2%}
.cast .f svg{width:100%;height:100%;overflow:visible}
.chaps{display:grid;gap:10px;width:min(400px,100%)}
.chap{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:18px;padding:12px 14px;background:#fff;color:#2a1240;font:400 14px/1.3 Rubik;box-shadow:0 5px 0 #0007;cursor:pointer;min-height:72px}
.chap .n{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:400 18px "Rubik Mono One",Rubik;color:#fff}
.chap strong{display:block;font:800 17px/1.2 Rubik}
.chap .new{font:800 10px Rubik;background:var(--red);color:#fff;padding:3px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.chap:active{transform:translateY(3px);box-shadow:0 2px 0 #0007}
.gal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;max-width:420px}
.gal h3{width:100%;margin:6px 0 0;font:600 13px Rubik;opacity:.7}
.gal span{font-size:12px;padding:5px 9px;border-radius:999px;background:#fff1;border:1px solid #fff2}
.gal span.got{background:var(--gold);color:#3a1a00;border-color:transparent;font-weight:600}
#end{background:#1a0a28e6;backdrop-filter:blur(4px);justify-content:center}
#end .card{background:linear-gradient(160deg,#fff,#ffe7f3);color:#2a1240;border-radius:24px;padding:22px 20px;max-width:380px;width:100%;box-shadow:0 10px 0 #0006;animation:pop .5s forwards;opacity:0;transform:scale(.8)}
#end small{font:800 12px Rubik;color:var(--red)}
#end h2{font:400 clamp(22px,6.5vw,30px)/1.1 "Rubik Mono One",Rubik;margin:6px 0 10px;text-wrap:balance}
#end p{margin:0 0 14px}
.bar{height:12px;border-radius:99px;background:#2a124022;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vio),var(--red));border-radius:inherit}
.big{min-height:54px;border:0;border-radius:16px;padding:0 24px;font:800 17px Rubik;background:var(--gold);color:#3a1a00;box-shadow:0 5px 0 #b0780a;cursor:pointer}
.big.alt{background:#2a1240;color:#fff;box-shadow:0 5px 0 #0006}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.flame{transform-origin:50% 100%;animation:flk .25s infinite alternate}
@keyframes flk{to{transform:scale(.85,1.12)}}
.hot .glow{animation:hot .3s infinite alternate}
@keyframes hot{from{fill:#ff6a00}to{fill:#ffd000}}
.sway{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:translateX(-50%) rotate(4deg) translateY(-4%)}}
.buzz{animation:buzz .12s linear infinite}
.disco{animation:dsc 2s linear infinite}
.wag{animation:wag .4s ease-in-out infinite}
@keyframes buzz{25%{transform:translateX(-50%) rotate(-8deg)}75%{transform:translateX(-50%) rotate(8deg)}}
@keyframes dsc{50%{transform:translateX(-50%) scaleX(-1)}}
@keyframes wag{50%{transform:translateX(-50%) translateY(-6%) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>

const WHO={n:['Рассказчик','#cfc6ff'],o:['Олешек','#ffcf9e'],f:['Друзья','#9fe8ff'],u:['Олюшка','#ffb8dc'],r:['Робот','#c8d4e8'],d:['Пончик','#ffd08a'],m:['@saynez',FD.m.c],x:['@drom1x',FD.x.c],h:[NAME,'#ffc83d']};

/* ---------- state + storage ---------- */
const $=id=>document.getElementById(id);
let cur=null,li=0,typing=false,tmr=null,full='',snd=true,found=[],chap=1;
try{found=JSON.parse(localStorage.getItem('bd_ends')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('bd_ends',JSON.stringify(found))}catch(e){}};
const fill=t=>t.replaceAll('{N}',NAME);

/* ---------- sound ---------- */
let ac=null;
function tone(f,d,type='square',v=.04,t0=0){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+t0,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const NT={G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
function melody(){const m='G4 G4 A4 G4 C5 B4 _ G4 G4 A4 G4 D5 C5 _ G4 G4 G5 E5 C5 B4 A4 _ F5 F5 E5 C5 D5 C5'.split(' ');let t=0;m.forEach((n,i)=>{if(n==='_'){t+=.2;return}const d=(m[i+1]==='_'||i===m.length-1)?.42:.26;tone(NT[n],d+.1,'triangle',.07,t);t+=d})}
const chime=()=>[784,988,1319].forEach((f,i)=>tone(f,.25,'triangle',.05,i*.07));
const thud=()=>{tone(90,.4,'sine',.12);tone(60,.5,'sine',.1,.05)};

/* ---------- particles ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let parts=[],mode='none',W=0,Hh=0,fwT=0;
function rs(){const r=$('scene').getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;Hh=r.height;cv.width=W*d;cv.height=Hh*d;cx.setTransform(d,0,0,d,0,0)}
const ro=new ResizeObserver(rs);ro.observe($('scene'));
const COL=['#ffc83d','#e0262f','#8b4dff','#3ac1ff','#ff6fb5','#fff'];
const rnd=(a,b)=>a+Math.random()*(b-a);
function spawn(k,x,y){
 if(k==='snow'||k==='snowP')parts.push({k,x:rnd(0,W),y:-8,vx:rnd(-.3,.3),vy:rnd(.6,1.5),r:rnd(1.5,3.8),c:k==='snowP'?'#c79bff':'#fff',l:999});
 else if(k==='confetti')parts.push({k,x:rnd(0,W),y:-10,vx:rnd(-1,1),vy:rnd(1.5,3),r:rnd(4,8),c:COL[(Math.random()*6)|0],a:rnd(0,6),va:rnd(-.2,.2),l:999});
 else if(k==='smoke')parts.push({k,x:W*.8+rnd(-20,20),y:Hh*.62,vx:rnd(-.8,.2),vy:rnd(-1.6,-.7),r:rnd(10,20),c:'#3a3340',l:120,m:120});
 else if(k==='sparkle'||k==='hearts')parts.push({k,x:rnd(W*.1,W*.9),y:rnd(Hh*.2,Hh*.95),vx:0,vy:k==='hearts'?-.7:-.2,r:rnd(3,7),c:k==='hearts'?['#ff6fb5','#e0262f','#ff9de0'][(Math.random()*3)|0]:'#fff6b0',l:90,m:90});
 else if(k==='spark')parts.push({k,x,y,vx:rnd(-4,4),vy:rnd(-4,4),r:rnd(1.5,3),c:COL[(Math.random()*6)|0],l:60,m:60});
 else if(k==='disco')parts.push({k,x:W/2,y:Hh*.2,a:rnd(0,7),va:rnd(.005,.02),c:COL[(Math.random()*5)|0],l:200,m:200});
}
function burst(x,y,n=40){for(let i=0;i<n;i++)spawn('spark',x,y)}
function heart(x,y,r){cx.beginPath();cx.moveTo(x,y+r*.3);cx.bezierCurveTo(x,y,x-r,y,x-r,y+r*.3);cx.bezierCurveTo(x-r,y+r*.7,x,y+r,x,y+r*1.3);cx.bezierCurveTo(x,y+r,x+r,y+r*.7,x+r,y+r*.3);cx.bezierCurveTo(x+r,y,x,y,x,y+r*.3);cx.fill()}
function loop(){
 cx.clearRect(0,0,W,Hh);
 const rate={snow:.5,snowP:.6,confetti:.6,smoke:.35,sparkle:.15,hearts:.12,disco:.25}[mode]||0;
 if(Math.random()<rate*2&&parts.length<260)spawn(mode);
 if(mode==='fireworks'&&--fwT<0){fwT=rnd(25,55);burst(rnd(W*.15,W*.85),rnd(Hh*.08,Hh*.4),50);tone(rnd(120,200),.25,'sawtooth',.02)}
 for(const p of parts){
  p.l--;
  if(p.k==='disco'){p.a+=p.va;cx.globalAlpha=.18*(p.l/p.m);cx.fillStyle=p.c;cx.beginPath();cx.moveTo(p.x,p.y);cx.arc(p.x,p.y,Hh*1.4,p.a,p.a+.08);cx.fill();continue}
  p.x+=p.vx;p.y+=p.vy;
  if(p.k==='spark'){p.vy+=.06;p.vx*=.98}
  if(p.k==='confetti'){p.a+=p.va;p.x+=Math.sin(p.y/30)*.5}
  if(p.k==='smoke')p.r+=.35;
  cx.globalAlpha=p.m?Math.max(0,p.l/p.m)*(p.k==='smoke'?.55:1):1;cx.fillStyle=p.c;
  if(p.k==='confetti'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}
  else if(p.k==='hearts')heart(p.x,p.y,p.r);
  else if(p.k==='sparkle'){cx.save();cx.translate(p.x,p.y);cx.rotate(.785);cx.fillRect(-p.r/2,-p.r/2,p.r,p.r);cx.restore()}
  else{cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
 }
 cx.globalAlpha=1;
 parts=parts.filter(p=>p.l>0&&p.y<Hh+30&&p.y>-60);
 requestAnimationFrame(loop);
}
loop();

/* ---------- friends ---------- */
function friends(s){
 const ks=(s.fr||'').split('').filter(Boolean);
 const pos={1:[74],2:[66,88],3:[62,79,95]}[ks.length]||[];
 $('friends').innerHTML=ks.map((k,i)=>`<div class="fr${s.far?' far':''}" id="fr-${k}" style="left:${pos[i]}%;z-index:${i===1?3:2}"><div class="in" style="animation-delay:${i*.25}s">${fsvg(k,s.fm)}<span class="nm">${FD[k].n}</span></div></div>`).join('');
}
function talk(w){
 $('hero').classList.toggle('deer',w==='o');
 $('hero').classList.toggle('talk',w==='h');
 document.querySelectorAll('.fr').forEach(f=>f.classList.toggle('talk',w==='f'||f.id==='fr-'+w));
}

/* ---------- scenes ---------- */
function render(s){
 $('bg').className='bg bg-'+s.bg;
 const mk=a=>a.map(([k,x,b,w,_,cls])=>`<div class="prop ${cls||''} ${k==='balloons'?'sway':''} ${k==='phone'?'buzz':''} ${k==='disco'?'disco':''}" style="left:${x}%;bottom:${b}%;width:${w}%">${P[k]}</div>`).join('');
 $('props').innerHTML=mk(s.props.filter(p=>!p[4]));
 $('propsF').innerHTML=mk(s.props.filter(p=>p[4])).replace(/class="prop/g,'class="prop front');
 friends(s);
 $('heroImg').src=IMG[s.face];
 $('hero').className='a-'+s.a;
 $('hero').style.left=s.x+'%';
 $('dark').className=s.dark||'';
 const b=$('banner');b.style.display=s.banner?'block':'none';$('tag').style.display=s.banner?'none':'';b.textContent='С днём рождения, '+NAME+'!';
 mode=s.fx||'none';parts=parts.filter(p=>p.k==='spark');
}
function go(id){
 const s=S[id];cur=s;cur.id=id;li=0;
 if(s.ch){chap=s.ch;$('chapTag').textContent=chap===1?'Глава 1 · Никто не поздравил?':'Глава 2 · Кто украл торт?'}
 $('scene').classList.add('fade');
 $('choices').innerHTML='';$('txt').textContent='';$('who').textContent='';
 setTimeout(()=>{render(s);$('scene').classList.remove('fade');if(s.end&&!found.includes(id)){found.push(id);save()}line()},350);
}
function line(){
 const [w,t,o]=cur.l[li];full=fill(t);
 if(o&&o.dark){$('dark').className=o.dark==='off'?'':o.dark;if(o.dark==='dark')thud()}
 const [nm,col]=WHO[w];
 $('who').textContent=nm;$('who').style.background=col;
 talk(w);
 $('txt').textContent='';$('next').style.display='none';
 typing=true;let i=0;clearInterval(tmr);
 const pitch={o:880,r:300,h:620,d:240,m:760,x:420,t:560}[w]||480;
 tmr=setInterval(()=>{i++;$('txt').textContent=full.slice(0,i);if(i%3===0&&full[i]!==' ')tone(pitch,.03,'square',.015);if(i>=full.length)done()},24);
}
function done(){
 clearInterval(tmr);typing=false;$('txt').textContent=full;
 if(li<cur.l.length-1){$('next').style.display='block';return}
 talk('');
 if(cur.end){setTimeout(showEnd,700);return}
 $('choices').innerHTML=cur.c.map((_,i)=>`<button class="ch" data-i="${i}" style="animation-delay:${i*.08}s"><b>${i+1}</b><span></span></button>`).join('');
 [...$('choices').children].forEach((b,i)=>b.querySelector('span').textContent=cur.c[i][0]);
}
function adv(){if(!cur||$('choices').children.length)return;if(typing){done();return}if(li<cur.l.length-1){li++;line()}}
$('panel').addEventListener('click',e=>{const b=e.target.closest('.ch');if(b){e.stopPropagation();chime();burst(W/2,Hh*.5,30);go(cur.c[+b.dataset.i][1]);return}adv()});
document.addEventListener('keydown',e=>{if($('start').classList.contains('on')||$('end').classList.contains('on'))return;const n=parseInt(e.key);const bs=$('choices').children;if(n&&bs[n-1]){bs[n-1].click();return}if(e.key===' '||e.key==='Enter'){e.preventDefault();adv()}});

/* ---------- endings + menu ---------- */
const inCh=c=>ENDS.filter(k=>chOf(k)===c);
function showEnd(){
 const list=inCh(chOf(cur.id)),got=list.filter(k=>found.includes(k)).length;
 const [t,d]=cur.end;
 $('endNum').textContent='Глава '+chOf(cur.id)+' · концовка '+(list.indexOf(cur.id)+1)+' из '+list.length;
 $('endT').textContent=t;$('endD').textContent=fill(d);
 $('endP').textContent='Открыто в этой главе: '+got+' / '+list.length+(got===list.length?' — все найдены!':'');
 $('endBar').style.width=(got/list.length*100)+'%';
 $('end').classList.add('on');melody();
 for(let i=0;i<4;i++)setTimeout(()=>burst(rnd(40,W-40),rnd(40,Hh*.5),45),i*300);
}
function gal(){
 [1,2].forEach(c=>{const l=inCh(c);$('p'+c).textContent='Концовки: '+l.filter(k=>found.includes(k)).length+' / '+l.length});
 $('gal').innerHTML=[1,2].map(c=>`<h3>Глава ${c}</h3>`+inCh(c).map(k=>`<span class="${found.includes(k)?'got':''}" data-k="${k}"></span>`).join('')).join('');
 $('gal').querySelectorAll('span').forEach(s=>s.textContent=found.includes(s.dataset.k)?S[s.dataset.k].end[0]:'???');
}
function menu(){$('end').classList.remove('on');$('start').classList.add('on');gal();mode='none';clearInterval(tmr)}
document.querySelectorAll('.chap').forEach(b=>b.onclick=()=>{$('start').classList.remove('on');chime();go(b.dataset.c==='2'?'c2':'start')});
$('again').onclick=()=>{$('end').classList.remove('on');go(chOf(cur.id)===2?'c2':'start')};
$('menu').onclick=menu;$('home').onclick=menu;
$('snd').onclick=()=>{snd=!snd;$('snd').textContent=snd?'🔊':'🔇'};
